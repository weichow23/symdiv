[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symdiv"
version = "0.2.0"
description = "A reproducible neuro-symbolic static analyzer for C divide-by-zero defects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "z3-solver==4.13.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
symdiv = "symdiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

